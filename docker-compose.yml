# Local development stack. Start it with:
#   cp .env.example .env && docker compose up -d
services:
  postgres:
    # pgvector ships the vector extension on top of the official Postgres image.
    image: pgvector/pgvector:pg17
    container_name: glosa-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Consumed by the init scripts to provision the least-privileged
      # application role that Row Level Security is enforced against.
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, on an empty data directory, before the application connects.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ollama:
    # Local embedding and chat models, so development costs nothing.
    image: ollama/ollama:0.12.3
    container_name: glosa-ollama
    ports:
      - "${OLLAMA_PORT}:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  postgres-data:
  ollama-models:

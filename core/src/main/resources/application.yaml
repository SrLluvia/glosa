spring:
  application:
    name: glosa-core

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:glosa}
    # The service connects as the least-privileged role, so Row Level Security
    # applies to every statement it issues.
    username: ${APP_DB_USER}
    password: ${APP_DB_PASSWORD}

  flyway:
    enabled: true
    # Migrations need schema privileges, so they run as the owner role instead.
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  servlet:
    multipart:
      # Bounded so a single upload cannot exhaust memory or disk. The pipeline
      # handles documentation, not media.
      max-file-size: 25MB
      max-request-size: 26MB

  mvc:
    problemdetails:
      # Errors are reported as RFC 7807 problem documents, including the ones
      # Spring raises before our own handlers see them.
      enabled: true

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks the mapping matches it.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

glosa:
  search:
    # How much the keyword half counts for against the semantic half, which is
    # fixed at one. Reciprocal Rank Fusion assumes the rankers it merges are of
    # comparable quality; when one is clearly weaker, merging them as equals
    # drags the better one down. The evaluation suite measures both halves
    # separately, and this is where that measurement is acted on. It is
    # configuration rather than a constant because the right value depends on
    # the corpus: prose favours the semantic half, while a corpus full of error
    # codes and version numbers favours the keyword one.
    keyword-weight: 0.2
    # Cosine distance beyond which a passage is not worth answering from.
    # Vector search returns the nearest passages however far away they are, and
    # nearest is not relevant. Calibrated against the evaluation set, where the
    # furthest passage that genuinely answered its question sat at 0.507.
    # Belongs to the embedding model: change the model and measure it again.
    max-useful-distance: 0.52
    # The k in 1/(k + rank). The familiar value of 60 comes from fusing many
    # rankers of comparable quality over a large corpus, and it deliberately
    # flattens the difference between adjacent positions. That flattening is
    # wrong here: at k=60 the gap between rank 1 and rank 2 is about 0.0003,
    # while merely appearing in the other list is worth around 0.005, so
    # presence in both lists beats being first in the better one almost
    # regardless of weight. A smaller k restores the meaning of position.
    fusion-constant: 10

  rag:
    base-url: ${RAG_URL:http://localhost:8000}
    # Generous: a cold model is loaded on the first call, and a small machine
    # can take a while over it.
    timeout: PT180S
    # Matches what the rag service accepts in one request.
    batch-size: 64

  ingestion:
    enabled: true
    # Short enough that an upload feels like it is being worked on, long enough
    # that an idle queue is not hammered.
    poll-interval: PT2S
    batch-size: 10
    # A job claimed but untouched for this long is assumed abandoned by a worker
    # that died, and is returned to the queue.
    stale-after: PT5M

  security:
    jwt:
      secret: ${GLOSA_JWT_SECRET}
      issuer: glosa
      access-token-ttl: PT1H

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # Endpoints grouped the way the API reads, not alphabetically by class.
    tags-sorter: alpha
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

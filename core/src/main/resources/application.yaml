spring:
  application:
    name: glosa-core

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:glosa}
    # The service connects as the least-privileged role, so Row Level Security
    # applies to every statement it issues.
    username: ${APP_DB_USER}
    password: ${APP_DB_PASSWORD}

  flyway:
    enabled: true
    # Migrations need schema privileges, so they run as the owner role instead.
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  servlet:
    multipart:
      # Bounded so a single upload cannot exhaust memory or disk. The pipeline
      # handles documentation, not media.
      max-file-size: 25MB
      max-request-size: 26MB

  mvc:
    problemdetails:
      # Errors are reported as RFC 7807 problem documents, including the ones
      # Spring raises before our own handlers see them.
      enabled: true

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks the mapping matches it.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

glosa:
  ingestion:
    enabled: true
    # Short enough that an upload feels like it is being worked on, long enough
    # that an idle queue is not hammered.
    poll-interval: PT2S
    batch-size: 10
    # A job claimed but untouched for this long is assumed abandoned by a worker
    # that died, and is returned to the queue.
    stale-after: PT5M

  security:
    jwt:
      secret: ${GLOSA_JWT_SECRET}
      issuer: glosa
      access-token-ttl: PT1H

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # Endpoints grouped the way the API reads, not alphabetically by class.
    tags-sorter: alpha
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

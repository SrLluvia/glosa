[project]
name = "glosa-rag"
version = "0.1.0"
description = "Embeddings and grounded answer generation for Glosa"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.120.4",
    "uvicorn[standard]==0.38.0",
    "httpx==0.28.1",
    "pydantic==2.12.3",
    "pydantic-settings==2.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.1",
    "pytest-asyncio==1.3.0",
    "respx==0.22.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the job only reads the checkout. Nothing here publishes.
permissions:
  contents: read

concurrency:
  # A new push supersedes the run already in flight for the same branch.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          # Caches ~/.m2 keyed on the pom, so a run that changes no dependency
          # does not re-download the world.
          cache: maven
          cache-dependency-path: core/pom.xml

      - name: Build and test
        working-directory: core
        # The suite starts a real PostgreSQL through Testcontainers; the hosted
        # runner already has a Docker daemon, so nothing extra is needed.
        run: ./mvnw -B --no-transfer-progress verify

      - name: Publish test report
        # Runs even when the build failed, which is exactly when the report is
        # worth having.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: core/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

  rag:
    name: rag (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: rag/pyproject.toml

      - name: Install
        working-directory: rag
        run: pip install -e ".[dev]"

      - name: Test
        working-directory: rag
        # Ollama is stubbed, so no model is needed here. Whether a real model
        # answers well is the evaluation suite's job, not this one's.
        run: pytest -q

  eval:
    name: evaluation (dataset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The full suite needs a stack and two models, which is far more than a
      # pull request should wait for. What runs here is the part that can go
      # wrong silently: the dataset and the scoring. A question whose expected
      # heading no longer exists in the corpus would otherwise quietly stop
      # being measured, and the figures would improve for the wrong reason.
      - name: Check the dataset and the metrics
        working-directory: eval
        run: python -m unittest discover -s . -p "test_*.py" -v
